<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b73"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#fbfbfc"/>

  <text x="40" y="44" font-size="19" font-weight="600" fill="#2d2d2d">J-SOS: one always-on service, one database</text>
  <text x="40" y="68" font-size="13.5" fill="#6b6b73">The phone talks only to the load balancer, Cognito and S3. Everything else runs inside the service.</text>

  <!-- row 1 -->
  <rect x="40" y="110" width="230" height="66" rx="8" fill="#eef4fb" stroke="#a7c7e7" stroke-width="1.5"/>
  <text x="58" y="136" font-size="14" font-weight="600" fill="#2d2d2d">Amazon Cognito</text>
  <text x="58" y="157" font-size="12.5" fill="#55555c">sign-in, three role groups</text>

  <rect x="600" y="110" width="260" height="66" rx="8" fill="#fdf0f3" stroke="#f2b8c6" stroke-width="1.5"/>
  <text x="618" y="136" font-size="14" font-weight="600" fill="#2d2d2d">APNs · Twilio SMS · Amazon SES</text>
  <text x="618" y="157" font-size="12.5" fill="#55555c">outbound alerts, called in parallel</text>

  <!-- row 2 -->
  <rect x="40" y="250" width="230" height="78" rx="8" fill="#ffffff" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="58" y="277" font-size="14" font-weight="600" fill="#2d2d2d">iPhone app</text>
  <text x="58" y="297" font-size="12.5" fill="#55555c">on-device encryption</text>
  <text x="58" y="315" font-size="12.5" fill="#55555c">offline SOS queue</text>

  <rect x="330" y="250" width="210" height="78" rx="8" fill="#ffffff" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="348" y="277" font-size="14" font-weight="600" fill="#2d2d2d">Load balancer</text>
  <text x="348" y="297" font-size="12.5" fill="#55555c">HTTPS and WebSocket</text>
  <text x="348" y="315" font-size="12.5" fill="#55555c">the only public entry</text>

  <rect x="600" y="240" width="260" height="98" rx="8" fill="#f3edfa" stroke="#9b7fc4" stroke-width="2.5"/>
  <text x="618" y="267" font-size="14" font-weight="600" fill="#2d2d2d">NestJS service on ECS Fargate</text>
  <text x="618" y="288" font-size="12.5" fill="#55555c">REST API · WebSocket relay</text>
  <text x="618" y="306" font-size="12.5" fill="#55555c">SOS dispatch · pg-boss jobs</text>
  <text x="618" y="324" font-size="12.5" fill="#55555c">always on, no cold start</text>

  <!-- row 3 -->
  <rect x="40" y="410" width="230" height="66" rx="8" fill="#ffffff" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="58" y="436" font-size="14" font-weight="600" fill="#2d2d2d">S3 audio bucket</text>
  <text x="58" y="457" font-size="12.5" fill="#55555c">presigned uploads</text>

  <rect x="330" y="410" width="210" height="66" rx="8" fill="#ffffff" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="348" y="436" font-size="14" font-weight="600" fill="#2d2d2d">Tracking page</text>
  <text x="348" y="457" font-size="12.5" fill="#55555c">S3 and CloudFront</text>

  <rect x="600" y="410" width="260" height="66" rx="8" fill="#eef4fb" stroke="#a7c7e7" stroke-width="1.5"/>
  <text x="618" y="436" font-size="14" font-weight="600" fill="#2d2d2d">PostgreSQL on RDS</text>
  <text x="618" y="457" font-size="12.5" fill="#55555c">the only database, KMS-encrypted</text>

  <!-- arrows -->
  <line x1="155" y1="250" x2="155" y2="182" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="166" y="221" font-size="12" fill="#6b6b73">sign in</text>

  <line x1="155" y1="328" x2="155" y2="404" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="166" y="372" font-size="12" fill="#6b6b73">audio upload</text>

  <line x1="270" y1="289" x2="324" y2="289" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="540" y1="289" x2="594" y2="289" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="730" y1="240" x2="730" y2="182" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="741" y="216" font-size="12" fill="#6b6b73">push, SMS, email</text>

  <line x1="730" y1="338" x2="730" y2="404" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="741" y="376" font-size="12" fill="#6b6b73">all data</text>

  <line x1="435" y1="410" x2="435" y2="334" stroke="#6b6b73" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="446" y="376" font-size="12" fill="#6b6b73">token lookups</text>

  <text x="40" y="520" font-size="12.5" fill="#6b6b73">Message bodies exist on the server only as ciphertext. Location points are purged 24 hours after an alert closes.</text>
</svg>
